 pirate_ships_engineering.4405.desc: "공짜 빵, 우정, 그리고 물론 관대한 보상을 위해 떠났던 우리 형제들이 우리에게 기술을 주었습니다. £minerals£§G-100§!"
 pirate_ships_engineering.4406.desc: "이 함선을 분해한 것은 잘한 일입니다.\n이제 해적 함선 제작 기술을 배울 수 있습니다."
 pirate_ships_engineering.4406.name: "좋아!"
 playable_pirate_station: "소행성 기지 I"
 playable_pirate_station_plural: "소행성 기지 I"
 requires_asteroid: "$TRIGGER_FAIL$소행성이나 위성이 아닌 곳에는 건설할 수 없습니다."
 requires_no_asteroid_station: "$TRIGGER_FAIL$이곳에는 이미 기지가 건설되었습니다."
 requires_not_inside_border: "$TRIGGER_FAIL$제국 영토 내에는 건설할 수 없습니다."
 scout_plural: "정찰선"
 seekers_of_luck.1.desc: "§H[From.System.GetName]§! 항성계의 소행성 기지가 건설되었지만, 우리 국경 내 항성계에 건설되었기 때문에 해적 중 아무도 정착하려 하지 않았습니다. 이제 이곳은 그냥 총 달린 소행성일 뿐입니다."
 seekers_of_luck.2.desc: "§H[From.System.GetName]§! 항성계에 소행성 기지가 건설되었습니다. 사용 가능한 최대 설계를 선택했습니다. 기지는 우리가 통제할 것입니다. 차액은 계좌로 반환되거나 인출될 것입니다."
 seekers_of_luck.2.name: "소행성 기지 건설됨"
 seekers_of_luck.3.a: "추가 요금이 부과됩니다: -[this.StationAdditionalpayment] (환급: [this.RefundPayment])"
 seekers_of_luck.3.b: "환급:+[this.StationAdditionalpayment] (환급: [this.RefundPayment])"
 seekers_of_luck.3.c: "추가 요금이 필요하지 않습니다."
 seekers_of_luck.3.desc: "§H[From.System.GetName]§! 항성계에 빈 해적 은신처가 건설되었습니다. 사용 가능한 최대 설계를 선택했습니다. 한두 달 안에 해적들이 기지를 점령할 것입니다.\n§H그들은 우리를 포함한 모두를 공격할 것이니, 이제 건설선을 여기서 빼낼 시간입니다!§!\n차액은 계좌로 반환되거나 인출될 것입니다."
 seekers_of_luck.3.name: "빈 해적 은신처 건설됨"
 seekers_of_luck.4.desc: "해적이 §H[From.System.GetName]§! 항성계에 도착하여 소행성 기지를 점령했습니다. 항성계가 우리에게 위험해졌습니다."
 seekers_of_luck.4.name: "증원군 도착"
 shipsize_assault_pirate_destroyer_build_cost_mult: "강습 호위함 건조 속도"
 shipsize_pirate_corvette_build_cost_mult: "습격선 건조 비용"
 shipsize_pirate_cruiser_build_cost_mult: "해적 순양함 건조 비용"
 shipsize_pirate_destroyer_build_cost_mult: "호위함 건조 비용"
 sm_pirate_assembly_yards: "해적 조립 시설"
 tech_pirate_ships: "해적 함선 분해"
 tech_pirate_ships_1: "해적 함선"
 tech_pirate_ships_1_desc: "새로운 시설과 건설 기술로 이제 습격선급, 호위함급, 해적 순양함급 군용 함선을 건조할 수 있습니다. 곧 일반 함급과 결합할 것입니다."
 tech_pirate_ships_desc: "수십 년간의 공학 경험 끝에, 이제 우리는 해적급 군용 함선을 분해할 능력을 갖추었습니다."
 tech_pirate_ships_hull_1: "개량된 소형 해적 선체"
 tech_pirate_ships_hull_1_desc: "건조 기술의 발전으로 더 튼튼하고 내구성 있는 습격선과 호위함을 건조할 수 있게 됩니다."
 tech_pirate_ships_hull_2: "개량된 해적 순양함 선체"
 tech_pirate_ships_hull_2_desc: "건조 기술의 발전으로 더 튼튼하고 내구성 있는 해적 순양함을 건조할 수 있게 됩니다."
 tech_pirate_yard: "표준화된 해적 패턴"
 tech_pirate_yard_desc: "해적 함선의 모델링 및 건조에 대한 새로운 표준을 확립하여 생산 라인의 효율성을 크게 향상시킵니다.\n\n"
 to_much_pirate_enclaves: "하나 이상의 해적 영지를 통제할 수 없습니다!"
 trait_cockroach_repugnant: "쓰레기 포식자"
 trait_cockroach_repugnant_desc: "§L바퀴벌레의 섭식 습관은 대부분의 문명화된 종족에게 혐오감을 줍니다. 하지만 까다롭지 않은 식성은 장점이 있습니다!§!"
 trait_radioactive_desc: "§L이 종은 장기간 방사능 환경에서 살아왔습니다. 비록 적응했지만, 이로 인해 수명과 번식에 문제가 생겼습니다.§!"
