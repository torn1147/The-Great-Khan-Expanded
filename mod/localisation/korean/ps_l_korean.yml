 COMBAT_COMPUTER_AGGRESSIVE_SAPIENT: "강습 공격 컴퓨터"
 COMBAT_COMPUTER_AGGRESSIVE_SAPIENT_DESC: "정확도와 연사력을 향상시키는 추가 로직과 함께 이전 모델의 주목할 만한 특징을 가진 강습 함선용으로 설계된 함선 AI입니다."
 COMBAT_COMPUTER_SCOUT_ADVANCED: "고급 정찰 컴퓨터"
 COMBAT_COMPUTER_SCOUT_ADVANCED_DESC: "정찰 및 은하 항로 개척에 맞춰 조정된 함선 AI의 최고 버전으로, 승무원 생존성을 최대로 높였습니다."
 COMBAT_COMPUTER_SCOUT_BASIC: "기본 정찰 컴퓨터"
 COMBAT_COMPUTER_SCOUT_BASIC_DESC: "강력한 공격성에 맞춰 조정된 함선 AI는 뛰어난 성능을 제공하며, 컴퓨터 자체의 죽음에 대한 두려움은 승무원 생존성을 극대화합니다."
 COMBAT_COMPUTER_SCOUT_DEFAULT: "표준 정찰 컴퓨터"
 COMBAT_COMPUTER_SCOUT_DEFAULT_DESC: "정찰선용 단순 함선 AI로, 죽음에 대한 자체 두려움이 승무원 생존성을 높입니다."
