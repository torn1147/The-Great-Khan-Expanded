 anomaly.2550.desc: "[From.GetName]에 대한 탐사를 진행하던 중, [Root.GetName]에 궤도상의 자동화 조선소 잔해가 감지되었습니다. 최소한 천 년 전에 건조된 시설로서, 대규모 미사일 폭격을 받은 것으로 보이지만 제조창 중 하나는 아직 가동할 수 있습니다.\n\n[Root.GetLeaderName] 과학 담당관은 조선소에 동력을 복구할 수 있다며 자신하고 있지만, 상당한 규모의 프로젝트가 될 것으로 예상됩니다."
 anomaly.2551.desc: "[Root.GetFleetName]의 성공적인 노력으로, [From.From.From.GetName]에서 발견한 자동화 조선소에 동력이 복구되었습니다. 이 시설은 예전에 중단되었던 지시에 따라 다시 함선 건조를 시작해, 현재 보유 중인 자재를 이용해 처음 보는 형상의 첨단 강습함 세 척을 만들어 냈습니다.\n\n애석하게도 이 시설은 강습함 건조 후 즉시 고장을 일으켰으며, 수리가 불가능할 정도로 손상된 것으로 파악됩니다. 새 함선에는 승무원을 투입해 우리 함대로 편입했습니다."
 anomaly.2552.desc: "[Root.GetFleetName]의 성공적인 노력으로, [From.From.From.GetName]에서 발견한 자동화 조선소에 동력이 복구되었습니다. 이 시설은 예전에 중단되었던 지시에 따라 다시 함선 건조를 시작해, 현재 보유 중인 자재를 이용해 처음 보는 형상의 구축함 한 척을 만들어 냈습니다.\n\n애석하게도 이 시설은 강습함 건조 후 즉시 고장을 일으켰으며, 수리가 불가능할 정도로 손상된 것으로 파악됩니다. 새 함선에는 승무원을 투입해 우리 함대로 편입했습니다."
 anomaly.2553.desc: "불행히도, 고대 시설 가동 후 완전히 고장나 수리 불가능 판정을 받았습니다.\n\n하지만 그리 나쁘지만은 않습니다! 그 과정에서 새로운 함선 설계도를 발견했습니다: 습격선, 호위함, 해적 순양함 및 소행성 전초기지!"
 little_asteroid_station: "작은 해적 기지"
 little_asteroid_station_DESC: "비밀 감시와 항성계 내 실제 주둔을 위해 여러 소행성을 연결한 작은 은신 기지입니다. 해적 은신처로 업그레이드할 수 있습니다.\n자체 설계를 만들지 않으면, 해적 기지 잔해에서 발견된 설계도를 사용할 것입니다.\n참고: 함선 설계자에서 무작위 설계가 선택됩니다. 설계가 적을수록 원하는 것을 만들 확률이 높아집니다."
 little_asteroid_station_MEGASTRUCTURE_DETAILS: "우리 제국이 관리하게 될 무작위 설계의 작은 소행성 기지 골조입니다. 실제 설계와의 가격 차액은 반환되거나 계좌에서 인출될 것입니다."
