 COMBAT_COMPUTER_AGGRESSIVE_ADVANCED_DESC: "해체된 해적 함선에서 발견된 개선된 AI는 이제 우리 해적 함선의 회피, 전투 속도 및 무기 피해를 향상시킵니다."
